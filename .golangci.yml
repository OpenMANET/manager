version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - containedctx
    - forcetypeassert
    - ginkgolinter
    - gochecknoglobals
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nestif
    - nlreturn
    - noctx
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    govet:
      enable-all: true
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
        shadow:
          strict: true
    misspell:
      locale: US
    nestif:
      min-complexity: 7
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - golint
        text: should not use dot imports
        source: ginkgo|gomega
      - linters:
          - gosec
        text: G110|G115|G601|G404|G204|G306
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
