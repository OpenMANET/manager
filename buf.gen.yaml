# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
inputs:
  - directory: proto
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/openmanet/openmanetd/internal/api
  # Don't modify any file option or field option for Protovalidate. Without
  # this, generated Go will fail to compile.
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  - local: protoc-gen-go
    out: internal/api
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/api
    opt:
      - paths=source_relative
      - simple
  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: internal/api
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v1.10.0
    out: frontend/src/gen
    opt: target=js
  - remote: buf.build/connectrpc/es:v1.6.1
    out: frontend/src/gen
    opt: target=js
