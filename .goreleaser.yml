env:
  - GO111MODULE=on
  - CGO_ENABLED=1
before:
  hooks:
    - go mod tidy
gomod:
  proxy: false
builds:
  - ldflags:
      - '-s -w -extldflags "-static"'
    flags:
      - "-a"
      - "-trimpath"
    tags:
      - netgo
    goos:
      - linux
    goarch:
      - arm64
     # - mips64
    mod_timestamp: "{{ .CommitTimestamp }}"
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
archives:
  - name_template: '{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}'
    files:
      - README.md
changelog:
  use: github-native
