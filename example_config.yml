logLevel: info
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  dataTypes:
    gateway: true
    node: true
    addressReservation: true
blos:
  enable: false
ptt:
  enable: false
  mcastAddr: 224.0.0.1
  mcastPort: 5010
  protocol: udp
  rtpId: ""
  pttKey: any
  debug: true
  trace: false
  loopback: true
  pttDevice: /dev/hidraw0/*
  pttDeviceName: Generic AB13X USB Audio
  # cm108 (default, C-Media CM108/CM108B USB HID dongle GPIO3), evdev (Linux input events), or bluealsa_xevent (BS-22 style AT+XEVENT controls)
  controlSource: cm108
  # Optional hint used to resolve BOTH input and output audio devices (e.g. "BS-22")
  # Only applied when inputDevice/outputDevice are left empty.
  audioDeviceHint: ""
  inputDevice: ""
  outputDevice: ""
  playbackBuffer: 2
