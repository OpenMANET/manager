logLevel: info
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  dataTypes:
    gateway: true
    node: true
    addressReservation: true
blos:
  enable: false
comms:
  enable: false
  protocol: rtp
  debug: true
  trace: false
  loopback: false
  controlSource: openvlm
  # PortAudio output device buffer depth (ms). Bounds the audio thread's
  # scheduling slack against OS preemption — too low and the DAC underruns
  # (audible stutter); too high and mouth-to-ear delay grows. Default 60 ms
  # = three 20 ms callback periods. Floored at the device's
  # DefaultHighOutputLatency, so values below the device hint are ignored.
  playbackLatencyMs: 60
  nanoPTT:
    enable: false
    devicePath: /dev/hidraw0/*
    deviceName: Generic AB13X USB Audio
  bluetoothPtt:
    enable: false
    BluetoothAudioDeviceHint: ""
    BluetoothInputDevice: ""
    BluetoothOutputDevice: ""
