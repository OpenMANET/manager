logLevel: info
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  dataTypes:
    gateway: true
    node: true
    addressReservation: true
blos:
  enable: false
comms:
  enable: false
  protocol: rtp
  debug: true
  trace: false
  loopback: false
  controlSource: openvlm
  # Microphone gain multiplier (1.0 = unity, 2.0 = +6 dB, 0.5 = -6 dB)
  micGain: "1.0"
  nanoPTT:
    enable: false
    devicePath: /dev/hidraw0/*
    deviceName: Generic AB13X USB Audio
  bluetoothPtt:
    enable: false
    BluetoothAudioDeviceHint: ""
    BluetoothInputDevice: ""
    BluetoothOutputDevice: ""
