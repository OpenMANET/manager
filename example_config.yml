logLevel: info
meshNetInterface: br-ahwlan
gatewayMode: false
dbFile: /etc/openmanetd/openmanetd.db
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  dataTypes:
    gateway: true
    node: true
    position: true
    addressReservation: true
ptt:
  enable: false
  mcastAddr: 224.0.0.1
  mcastPort: 5007
  protocol: udp
  rtpId: ""
  pttKey: any
  debug: true
  loopback: true
  pttDevice: /dev/hidraw0/*
  pttDeviceName: Generic AB13X USB Audio
