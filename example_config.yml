logLevel: info
meshNetInterface: br-ahwlan
gatewayMode: false
dbFile: /etc/openmanetd/openmanetd.db
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  dataTypes:
    gateway: true
    node: true
    position: true
    addressReservation: true
ptt:
  enable: false
  mcastAddr: 224.0.0.1
  mcastPort: 5010
  protocol: udp
  rtpId: ""
  pttKey: any
  debug: true
  trace: false
  loopback: true
  pttDevice: /dev/hidraw0/*
  pttDeviceName: Generic AB13X USB Audio
  # evdev (existing behavior) or bluealsa_xevent (for BS-22 style AT+XEVENT controls)
  controlSource: evdev
  # Optional hint used to resolve BOTH input and output audio devices (e.g. "BS-22")
  # Only applied when inputDevice/outputDevice are left empty.
  audioDeviceHint: ""
  inputDevice: ""
  outputDevice: ""
  playbackBuffer: 2
