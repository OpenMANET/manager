logLevel: info
gnss:
  enable: true
  # source selects which position provider feeds the GNSS subsystem:
  # "internal" (local gpsd receiver, default) or "external_cot" (adopt the
  # position broadcast by a connected EUD, e.g. ATAK, as Cursor-on-Target).
  source: internal
blos:
  enable: false
comms:
  enable: false
  debug: false
  controlSource: openvlm
  # DSCP marking for outgoing voice (RTP/RTCP). 46 = EF (default): voice
  # rides the elevated WMM video class end-to-end on the mesh. 48 = CS6:
  # full WMM voice class (validate the radio's EDCA behavior on-air
  # first). 0 = unmarked best-effort (pre-1.4 behavior). Out-of-range
  # values clamp into [0, 63].
  # dscp: 46
  # Playback device buffer depth in ms. The value becomes the ALSA period
  # size; the playback ring holds 3 periods, so device latency scales at
  # roughly 3x this value (USB audio devices round each period up to the
  # next power of two). Smaller values cut receive latency and PTT settle
  # time but shrink the margin against scheduling stalls before an
  # audible underrun. Default 60.
  # playbackLatencyMs: 60
  # Capture ring headroom in ms. The capture period is fixed at 20 ms
  # (one Opus frame); this value only sets the ring depth in periods
  # (ceil(value/20), clamped to 3..16), so 60 and below are all
  # equivalent to the 3-period floor. Raise above 60 only if a slow
  # device drops capture samples. Default 60.
  # captureLatencyMs: 60
# Periodic instrumentation snapshot. When enable is true the daemon writes a
# JSON snapshot of every runtime counter/metric to snapshotDir every
# intervalSecs. See docs/instrumentation-snapshot.md for the field reference.
# Snapshots are NOT rotated — pick an interval that matches the deployment
# and clean up /tmp manually. Disabled by default.
instrumentation:
  enable: false
  intervalSecs: 300
  snapshotDir: /tmp
