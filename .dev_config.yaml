logLevel: debug
meshNetInterface: eth0
dbFile: bin/openmanetd.db
gnss:
  enable: false
  sendAsExternalGNSSSource:
    sendAsNMEA: false
    sendAsCoT: false
batman:
  multicastEnhancementsEnabled: false
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  dataTypes:
    gateway: true
    node: true
    addressReservation: true
blos:
  enable: false
comms:
  enable: false
  protocol: rtp
  # openvlm (default, Open Voice Link Module USB HID dongle GPIO3), evdev, or bluealsa_xevent
  controlSource: openvlm
  debug: true
  loopback: false
  trace: true
  micGain: "1.0"
  nanoPTT:
    enable: false
    devicePath: /dev/hidraw0/*
    deviceName: Generic AB13X USB Audio
  bluetoothPtt:
    enable: false
    audioDeviceHint: ""
    inputDevice: ""
    outputDevice: ""
