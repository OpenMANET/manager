logLevel: debug
meshNetInterface: eth0
gatewayMode: false
dbFile: bin/openmanetd.db
gnss:
  enable: false
  sendAsExternalGNSSSource:
    sendAsNMEA: false
    sendAsCoT: false
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  dataTypes:
    gateway: true
    node: true
    position: true
    addressReservation: true
roip:
  enable: true
  statusWorkerInterval: 30
ptt:
  enable: false
  mcastAddr: 224.0.0.1
  mcastPort: 5007
  pttKey: any
  debug: true
  loopback: true
  pttDevice: /dev/hidraw0/*
  pttDeviceName: Generic AB13X USB Audio
